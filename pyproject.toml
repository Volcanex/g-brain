[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "g-brain"
version = "1.0.0"
description = "Brain MCP server and corpus tools, with the alert spine, pulse layer, todos and voice components"
dependencies = [
    "fastmcp>=4.0.10",
    "mcp>=2.3.0",
    "fastapi>=0.142.2",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
    "cryptography>=50.0.2",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
    "semble>=0.1",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[tool.setuptools]
packages = ["g_spine", "g_todos", "g_pulse", "g_brain", "voice", "inlets", "outlets"]
# g_config and brain_todos are real modules. The rest are compat aliases for modules that
# moved into the packages above (see "Old module names still work" in CLAUDE.md).
py-modules = [
    "g_config",
    "brain_todos",
    "brain_alerts", "brain_status", "unit_alert",
    "brain_pulse",
    "brain_reader", "brain_commit", "brain_index", "brain_refs", "brain_source", "brain_codex",
    "brain_verify", "brain_condense", "brain_gmap", "brain_miner", "brain_capture",
    "brain", "brain_api", "brain_oauth", "brain_access", "brain_surface",
]

[tool.gcore]
inherits_from = ["gcore"]
depends = ["ntfy", "openrouter", "telnyx"]
